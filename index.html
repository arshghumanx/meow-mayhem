  },
  isEquipped(cat, id) { return cat === 'avatar' ? this.P.avatar === id : this.P.eq[cat] === id; },
  /* Wager escrow: the stake leaves your balance when the match starts. */
  escrow(gid, cur, amt) {
    const P = this.P;
    if (amt <= 0) return true;
    if (P.escrow && P.escrow.gid === gid) return true;
    if (P.settled.includes(gid)) return false;
    if (P.escrow) this.refund();
    if (!this.spend(cur, amt)) return false;
    P.escrow = { gid, cur, amt, at: Date.now() };
    this.save();
    return true;
  },
  refund() {
    const e = this.P.escrow;
    if (!e) return null;
    this.add(e.cur, e.amt);
    this.P.escrow = null;
    this.save();
    return e;
  },
  forfeit(gid) {
    const P = this.P;
    if (P.escrow && P.escrow.gid === gid) P.escrow = null;
    if (!P.settled.includes(gid)) { P.settled.push(gid); P.stats.played++; P.stats.streak = 0; }
    this.save();
  },
  settle(res, seat) {
    const P = this.P;
    if (!res || seat < 0 || P.settled.includes(res.gid)) return null;
    const won = res.w === seat;
    const R = REWARDS[res.rmode] || REWARDS.bots;
    let [s, g] = won ? R.win : R.lose;
    P.stats.played++;
    if (won) { P.stats.wins++; P.stats.streak++; P.stats.best = Math.max(P.stats.best, P.stats.streak); }
    else P.stats.streak = 0;
    const mult = won && P.stats.streak > 1 ? 1 + Math.min(0.5, (P.stats.streak - 1) * 0.1) : 1;
    s = Math.round(s * mult);
    const out = { won, silver: s, gold: g, pot: 0, cur: res.cur, amt: res.amt, bonus: (res.bonus && res.bonus[seat]) || 0, streak: P.stats.streak, mult };
    if (res.amt > 0 && P.escrow && P.escrow.gid === res.gid) {
      if (won) { out.pot = res.pot; P.stats.potsWon++; }
      P.escrow = null;
    }
    const potS = out.pot && res.cur === 's' ? out.pot : 0, potG = out.pot && res.cur === 'g' ? out.pot : 0;
    P.silver += s + out.bonus + potS;
    P.gold += g + potG;
    P.stats.silverWon += s + out.bonus + potS;
    P.stats.goldWon += g + potG;
    P.settled.push(res.gid);
    P.settled = P.settled.slice(-30);
    this.save();
    return out;
  }
};

/* ==========================================================================
   Online accounts: a unique username plus a 4-digit PIN, kept in the game's
   Firebase project (Firestore over plain REST, no SDK).
     names/<username>          reserves a username (create-only)
     profiles/<sha256(...)>    the saved profile; its id needs the name AND the PIN
   Logging in anywhere loads that profile; every save is pushed back.
   ========================================================================== */
/* Public web config for the game's Firebase project; access is limited by its Firestore rules. */
const CLOUD = { projectId: 'meow-mayhem-d5d69', apiKey: 'AIzaSyBlajS-BPxdBVuHi0673jJ0c-qx1eDVdM4' };

const Cloud = {
  acct: null, busy: false, again: false, timer: null, lastPushed: 0,
  ready: () => !!(CLOUD.projectId && CLOUD.apiKey),
  validName: n => /^[A-Za-z0-9_]{3,16}$/.test(n),
  validPin: p => /^\d{4}$/.test(p),
  init() { const a = LS.get('mm_acct'); this.acct = a && a.name && a.key ? a : null; },
  url(path, q) {
    return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(CLOUD.projectId)}/databases/(default)/documents/${path}?key=${encodeURIComponent(CLOUD.apiKey)}${q || ''}`;
  },
  async key(name, pin) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(name.toLowerCase() + ':' + pin + ':meowmayhem'));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  },
  async req(path, opts, q) {
    let r;
    try { r = await withTimeout(fetch(this.url(path, q), opts), 10000); }
    catch (e) { throw new Error('Couldn’t reach the account server. Check your connection.'); }
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, err: (j.error && j.error.status) || '', j };
  },
  body(P, name) {
    return JSON.stringify({ fields: { j: { stringValue: JSON.stringify(P) }, at: { integerValue: String(P.updatedAt || 0) }, n: { stringValue: name } } });
  },
  async fetchProfile(key) {
    const r = await this.req('profiles/' + key, { method: 'GET' });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('The account server said no (' + (r.err || r.status) + ').');
    const f = r.j.fields || {};
    try { return f.j ? JSON.parse(f.j.stringValue) : null; } catch (e) { return null; }
  },
  async nameTaken(name) {
    const r = await this.req('names/' + name.toLowerCase(), { method: 'GET' });
    return r.ok;
  },
  remember(name, key) { this.acct = { name, key }; LS.set('mm_acct', this.acct); },
  /* Returns the stored profile, or throws a message for the player. */
  async login(name, pin) {
    if (!this.validName(name) || !this.validPin(pin)) throw new Error('Usernames are 3–16 letters, numbers or _, and the PIN is 4 digits.');
    const key = await this.key(name, pin);
    const P = await this.fetchProfile(key);
    if (!P) throw new Error((await this.nameTaken(name)) ? 'Wrong PIN for that username.' : 'No account with that username yet.');
    this.remember(name, key);
    return P;
  },
  /* Reserves the username and saves P as the account's first copy. */
  async signup(name, pin, P) {
    if (!this.validName(name)) throw new Error('Usernames are 3–16 letters, numbers or _.');
    if (!this.validPin(pin)) throw new Error('The PIN must be exactly 4 digits.');
    const r = await this.req('names/' + name.toLowerCase(), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: { n: { stringValue: name } } }) }, '&currentDocument.exists=false');
    if (!r.ok) {
      if (r.err === 'FAILED_PRECONDITION' || r.err === 'ALREADY_EXISTS' || r.status === 409) throw new Error('That username is taken. Try another.');
      throw new Error('Couldn’t create the account (' + (r.err || r.status) + ').');
    }
    const key = await this.key(name, pin);
    const w = await this.req('profiles/' + key, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: this.body(P, name) });
    if (!w.ok) throw new Error('Couldn’t save the new account (' + (w.err || w.status) + ').');
    this.remember(name, key);
    this.lastPushed = P.updatedAt || 0;
  },
  logout() { this.acct = null; LS.del('mm_acct'); clearTimeout(this.timer); },
  /* Every local save is pushed shortly after, one write at a time. */
  queue() { if (!this.acct || !this.ready()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1500); },
  async push() {
    if (!this.acct || !Prof.P) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    const P = Prof.P, at = P.updatedAt || 0;
    try {
      const r = await this.req('profiles/' + this.acct.key, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: this.body(P, this.acct.name) });
      if (r.ok) this.lastPushed = at;
    } catch (e) { /* offline: the next save tries again */ }
    this.busy = false;
    if (this.again) { this.again = false; this.push(); }
  },
  /* On launch: take the account's copy if it is newer than this device's, otherwise send ours up. */
  async sync() {
    if (!this.acct || !this.ready()) return false;
    try {
      const R = await this.fetchProfile(this.acct.key);
      if (R && (!Prof.P || (R.updatedAt || 0) > (Prof.P.updatedAt || 0))) { Prof.adopt(R); return true; }
      if (Prof.P) this.push();
    } catch (e) { /* offline: keep playing on this device's copy */ }
    return false;
  }
};

/* Sounds are synthesized and deliberately quiet: soft card slaps and slides,
   a faint chime for your turn, light wheel ticks, nothing that loops or blares. */
const Sound = {
  ac: null, master: null, nbuf: null,
  unlock() {
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ac = new AC();
        this.master = this.ac.createGain();
        this.master.gain.value = 0.5;
        const soft = this.ac.createBiquadFilter();
        soft.type = 'lowpass'; soft.frequency.value = 6500;
        this.master.connect(soft); soft.connect(this.ac.destination);
        const len = this.ac.sampleRate;
        this.nbuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
        const d = this.nbuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) { this.ac = null; }
  },
  on() { return !!(Prof.P && Prof.P.settings.sound && this.ac); },
  /* Filtered noise: the body of every card sound. */
  swish(o) {
    const ac = this.ac, t = ac.currentTime + (o.when || 0);
    const src = ac.createBufferSource(), hp = ac.createBiquadFilter(), bp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.nbuf;
    hp.type = 'highpass'; hp.frequency.value = o.hp || 500;
    bp.type = 'bandpass'; bp.Q.value = o.q || 0.8;
    bp.frequency.setValueAtTime(o.f0, t);
    if (o.f1) bp.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol, t + (o.att || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 0.8, o.dur + 0.05);
  },
  tone(f, dur, vol, when, type) {
    const ac = this.ac, t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  bell(f, vol, when) { this.tone(f, 0.5, vol, when); this.tone(f * 2.01, 0.22, vol * 0.3, when); },
  play(name, n) {
    if (!this.on()) return;
    try {
      switch (name) {
        case 'card': this.swish({ f0: 1900, f1: 950, dur: 0.075, vol: 0.2, hp: 600 }); this.tone(150, 0.05, 0.025); break;
        case 'special': this.swish({ f0: 1900, f1: 950, dur: 0.075, vol: 0.2, hp: 600 }); this.bell(784, 0.02, 0.05); break;
        case 'draw': for (let i = 0; i < (n || 1); i++) this.swish({ f0: 900, f1: 2600, q: 0.7, dur: 0.11, vol: 0.08, att: 0.03, hp: 400, when: i * 0.09 }); break;
        case 'deal': for (let i = 0; i < 6; i++) this.swish({ f0: 1100, f1: 2800, q: 0.7, dur: 0.09, vol: 0.06, att: 0.02, hp: 500, when: i * 0.075 }); break;
        case 'shuffle': for (let i = 0; i < 8; i++) this.swish({ f0: 1400, f1: 2400, q: 0.6, dur: 0.06, vol: 0.05, hp: 700, when: i * 0.045 }); break;
        case 'hit': this.tone(110, 0.22, 0.045); break;
        case 'turn': this.bell(660, 0.025); break;
        case 'tap': this.swish({ f0: 3200, q: 1.2, dur: 0.03, vol: 0.025, hp: 1500 }); break;
        case 'error': this.tone(220, 0.12, 0.03, 0, 'triangle'); break;
        case 'coin': this.bell(1318, 0.02); this.bell(1760, 0.016, 0.08); break;
        case 'win': [523, 659, 784].forEach((f, i) => this.bell(f, 0.035, i * 0.12)); break;
        case 'lose': this.bell(392, 0.025); this.bell(330, 0.025, 0.18); break;
        case 'mystery': [587, 740, 880].forEach((f, i) => this.bell(f, 0.018, i * 0.07)); break;
        case 'reflect': this.swish({ f0: 600, f1: 3000, q: 0.6, dur: 0.25, vol: 0.06, att: 0.08, hp: 300 }); break;
        case 'tick': this.swish({ f0: 2600, q: 2, dur: 0.018, vol: 0.05, hp: 1500 }); break;
        case 'pull': this.swish({ f0: 400, f1: 1800, q: 0.7, dur: 0.35, vol: 0.05, att: 0.12, hp: 250 }); break;
      }
    } catch (e) { /* audio unavailable */ }
  }
};

/* Lucky Wheel: 20 silver a spin. Slices are drawn equal; the real odds are listed under the wheel.
   Weights are thousandths of a percent. These odds are generous on purpose: a spin pays out far more than it costs. */
const LUCKY_COST = 20;
const LUCKY = [
  { c: 's', n: 50, w: 47000 },
  { c: 'g', n: 0, w: 2000 },
  { c: 's', n: 250, w: 15000 },
  { c: 'g', n: 10, w: 9000 },
  { c: 's', n: 1000, w: 4000 },
  { c: 'g', n: 100, w: 2000 },
  { c: 's', n: 7777, w: 500 },
  { c: 's', n: 0, w: 2000 },
  { c: 's', n: 100, w: 5000 },
  { c: 'g', n: 25, w: 4000 },
  { c: 's', n: 500, w: 9000 },
  { c: 'g', n: 500, w: 500 }
];
const LUCKY_TOTAL = LUCKY.reduce((a, p) => a + p.w, 0);
const LUCKY_SLICES = LUCKY.map(p => ({
  color: p.n === 0 ? '#262935' : p.c === 'g' ? (p.n >= 100 ? '#c2410c' : '#b7791f') : (p.n >= 1000 ? '#6d28d9' : '#3b4a66'),
  lines: [fmt(p.n)], coin: p.c, big: (p.c === 's' && p.n >= 1000) || (p.c === 'g' && p.n >= 100)
}));
function pickLucky() {
  const r = crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * LUCKY_TOTAL;
  let acc = 0;
  for (let i = 0; i < LUCKY.length; i++) { acc += LUCKY[i].w; if (r < acc) return i; }
  return 0;
}
const oddsText = w => { const p = (w / LUCKY_TOTAL) * 100; return (p >= 10 ? p.toFixed(0) : p >= 0.1 ? p.toFixed(1) : p >= 0.01 ? p.toFixed(2) : p.toFixed(3)).replace(/\.0$/, '') + '%'; };

/* Slice i is centred on angle i*step, measured clockwise from the pointer at the top. */
function wheelSVG(slices) {
  const n = slices.length, step = 360 / n, R = 100;
  const pt = (deg, r) => { const a = (deg - 90) * Math.PI / 180; return [(R + r * Math.cos(a)).toFixed(2), (R + r * Math.sin(a)).toFixed(2)]; };
  let fills = '', lines = '', labels = '';
  slices.forEach((s, i) => {
    const [x0, y0] = pt(i * step - step / 2, R), [x1, y1] = pt(i * step + step / 2, R);
    fills += `<path d="M${R} ${R}L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${s.color}"/>`;
    const [lx, ly] = pt(i * step - step / 2, R);
    lines += `<path d="M${R} ${R}L${lx} ${ly}"/>`;
    const one = s.lines.length === 1;
    const fs = s.coin ? (s.lines[0].length > 4 ? 11 : 13) : one ? (s.lines[0].length <= 2 ? 24 : 14) : 11;
    const y0t = s.coin ? 25 : one ? (fs > 20 ? 36 : 32) : 27;
    const txt = s.lines.map((l, j) => `<tspan x="${R}" dy="${j ? fs * 1.05 : 0}">${esc(l)}</tspan>`).join('');
    const coinUse = s.coin ? `<use href="#coin-${s.coin}" x="${R - 8}" y="34" width="16" height="16"/>` : '';
    labels += `<g transform="rotate(${(i * step).toFixed(2)} ${R} ${R})"${s.big ? ' class="big"' : ''}><text x="${R}" y="${y0t}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff" font-family="Outfit, system-ui, sans-serif">${txt}</text>${coinUse}</g>`;
  });
  return `<svg class="wheel-svg" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="100" fill="#15161c"/>${fills}<g stroke="rgba(255,255,255,.28)" stroke-width="1">${lines}</g><circle cx="100" cy="100" r="98.6" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.4"/>${labels}</svg>`;
}

/* Spin el (the rotating layer) so slice k ends under the pointer. Resolves when it stops. */
function spinWheelTo(el, n, k, opts) {
  opts = opts || {};
  const step = 360 / n, from = el._rot || 0, dur = opts.dur || 4200;
  const jitter = (Math.random() - 0.5) * step * 0.6;
  const base = -k * step + jitter;
  const to = from + 360 * (opts.turns || 5) + ((((base - from) % 360) + 360) % 360);
  el._rot = to;
  return new Promise(resolve => {
    if (reduceMotion() || document.hidden) { el.style.transform = `rotate(${to}deg)`; resolve(); return; }
    const t0 = performance.now();
    let last = Math.floor((from + step / 2) / step), lastTick = 0;
    const ease = t => 1 - Math.pow(1 - t, 4);
    const frame = now => {
      const t = Math.min(1, (now - t0) / dur), a = from + (to - from) * ease(t);
      el.style.transform = `rotate(${a.toFixed(2)}deg)`;
      const s = Math.floor((a + step / 2) / step);
      if (s !== last) { last = s; if (now - lastTick > 55) { lastTick = now; Sound.play('tick'); } }
      if (t < 1) requestAnimationFrame(frame); else resolve();
    };
    requestAnimationFrame(frame);
  });
}

/* An opponent's draw is shown card by card; a huge stack animates this many and the rest just appear. */
const OPP_DRAW_MAX = 8;

const COLOR_ORDER = { r: 0, y: 1, g: 2, b: 3, w: 4 };
const KIND_ORDER = '0123456789SRDHWFGCNM';
function sortHand(hand, deck) {
  return hand.slice().sort((a, b) => {
    const A = deck[a], B = deck[b];
    return (COLOR_ORDER[A.c] - COLOR_ORDER[B.c]) || (KIND_ORDER.indexOf(A.k) - KIND_ORDER.indexOf(B.k)) || a - b;
  });
}
function particleLayer(id) {

  if (!cfg || reduceMotion()) return '<div class="tparts"></div>';
  let h = '';
  for (let i = 0; i < cfg[1]; i++) {
    const x = (Math.random() * 100).toFixed(1), y = (Math.random() * 100).toFixed(1);
    const d = (Math.random() * 6 + 4).toFixed(1), dl = (-Math.random() * 10).toFixed(1), s = (Math.random() * 0.8 + 0.6).toFixed(2);
    h += `<i class="tp ${cfg[0]}" style="left:${x}%;top:${y}%;--d:${d}s;--dl:${dl}s;--s:${s}"></i>`;
  }
  return `<div class="tparts">${h}</div>`;
}

  oppOrder(n, me) {

      { transform: `translate(0,0) scale(1) rotate(${o.r0 || 0}deg)`, opacity: 1 },
      ...mid,
      { transform: `translate(${dx}px,${dy}px) scale(${sc}) rotate(${o.r1 || 0}deg)`, opacity: o.fade ? 0.2 : 1 }
    ], { duration: o.dur || 380, delay: o.delay || 0, easing: o.ease || 'cubic-bezier(.25,.8,.3,1)', fill: 'both' });
    a.onfinish = () => { el.remove(); if (o.done) o.done(); };
  },
  announce(title, sub, cls) {
    const el = $('#announce');
    if (!el) return;
    el.innerHTML = `<div class="an ${cls || ''}"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
  },
  floaty(i, me, text, cls) {
    const r = this.seatRect(i, me);
    if (!r) return;
    const f = document.createElement('div');
    f.className = 'floaty ' + (cls || '');
    f.textContent = text;
    f.style.left = (r.left + r.width / 2) + 'px';
    f.style.top = (i === me ? r.top : r.top + r.height / 2) + 'px';
    $('#fly').appendChild(f);
    setTimeout(() => f.remove(), 1400);
  },
  ev(e, T, G, me, prevRects) {
    const [, t, a, b, c] = e;
    const name = i => esc(seatName(T, i));
    const pileEl = $('#pile .top');
    const pileR = () => (pileEl || $('#pile')).getBoundingClientRect();
    const deckR = () => $('#deck').getBoundingClientRect();
    switch (t) {
      case 'start': {
        Sound.play('deal');
        for (let i = 0; i < G.n; i++) {
          for (let k = 0; k < 3; k++) this.fly(backHTML(Prof.P.eq.card), deckR(), this.seatRect(i, me), { w0: 56, w1: i === me ? 70 : 26, dur: 420, delay: (k * G.n + i) * 70, fade: true });
        }
        break;
      }
      case 'play': {
        const card = G.deck[b];
        const skin = seatCos(T, a).card;
        (this.cardOwner = this.cardOwner || {})[b] = skin;
        const from = a === me && prevRects[b] ? prevRects[b] : this.seatRect(a, me);
        const top = $('#pile .top');
        const holding = top && top.dataset.id == b && !reduceMotion();
        if (holding) top.classList.add('hold');
        this.fly(cardHTML(card, skin), from, pileR(), { w0: a === me ? (from ? from.width : 60) : 34, w1: pileR().width, r0: a === me ? 0 : -20, r1: (b % 7) - 3, done: () => {
          const tp = $('#pile .top'); if (tp) { tp.classList.remove('hold'); tp.classList.add('land'); }
        } });
        Sound.play(isNum(card.k) || card.k === 'S' || card.k === 'R' ? 'card' : 'special');
        if (a === me) vibrate(12);
        const k = card.k;
        if (k === 'S') this.announce('Skip!', '', 'k-s');
        else if (k === 'R') { this.announce('Reverse!', G.n === 2 ? 'Acts as a skip with 2 players' : '', 'k-r'); $('#dirring').classList.add('spin'); setTimeout(() => $('#dirring') && $('#dirring').classList.remove('spin'), 700); }
        else if (k === 'D') this.announce('+2', '', 'k-d');
        else if (k === 'F') this.announce('+4!', '', 'k-f');
        else if (k === 'H') this.announce('BOGO', 'Buy one, get one free', 'k-u');
        break;
      }
      case 'draw': {
        if (c === 1 && b >= 2) { this.floaty(a, me, '+' + b, 'bad'); Sound.play('hit'); if (a === me) vibrate([30, 40, 30]); }
        if (a !== me) { this.oppDraw(a, b, T); break; }
        const n = Math.min(b, 6);
        for (let i = 0; i < n; i++) this.fly(backHTML(Prof.P.eq.card), deckR(), this.seatRect(a, me), { w0: 56, w1: 70, dur: 400, delay: i * 80 });
        Sound.play('draw', Math.min(b, 4));
        break;
      }
      case 'skip': this.floaty(a, me, 'Skipped', 'skip'); break;
      case 'stack': if (b > 2 && G.rules.stack) this.announce(`Stack +${b}!`, '', 'k-f'); break;
      case 'reflect': this.announce('Reflected!', `${name(a)} bounced +${c} back to ${name(b)}`, 'k-u'); Sound.play('reflect'); break;
      case 'copy': this.announce('Copycat', `copies ${esc(KIND_NAME[b] || 'the ' + b)}`, 'k-u'); break;
      case 'give': this.fly(backHTML(seatCos(T, a).card), this.seatRect(a, me), this.seatRect(b, me), { w0: 34, w1: 34, dur: 520 }); this.floaty(b, me, '+1 free', 'bad'); break;
      case 'spin': this.wheel(a, b, T, G, me); break;
      case 'peek': { const ids = unpackPeek(c); if (a === me && ids.length) this.reveal(b, ids, T, G); else this.floaty(a, me, 'Peeked', 'skip'); break; }
      case 'magnet': {
        /* The pulled cards chase the Magnet onto the pile, one after another. */
        const ids = G.pull || [], skin = seatCos(T, a).card;
        ids.forEach((id, i) => {
          const mine = a === me && prevRects[id];
          this.fly(cardHTML(G.deck[id], skin), mine ? prevRects[id] : this.seatRect(a, me), pileR(), {
            w0: mine ? prevRects[id].width : 34, w1: pileR().width * 0.94, r0: mine ? 0 : -14, r1: i % 2 ? 6 : -6,
            dur: 560, delay: 140 + i * 120, ease: 'cubic-bezier(.6,0,.4,1)',
            done: () => { const tp = $('#pile .top'); if (tp) { tp.classList.remove('land'); void tp.offsetWidth; tp.classList.add('land'); } Sound.play('card'); }
          });
        });
        if (ids.length) this.announce('Magnet', `${name(a)} pulled ${ids.length} ${COLOR_NAME[COLORS[c]] || ''} card${ids.length === 1 ? '' : 's'}`, 'k-u');
        Sound.play('pull');
        break;
      }
      case 'takeover': toast(`A bot is playing for ${name(a)} for now`); break;
      case 'back': toast(`${name(a)} is back`); break;
      case 'reshuffle': toast('Reshuffling the discard pile'); Sound.play('shuffle'); break;
      case 'timeout': this.floaty(a, me, 'Time’s up', 'late'); if (a === me) vibrate(30); break;
      case 'turn': if (a === me && app.mode !== 'local') { Sound.play('turn'); vibrate(20); } break;
      case 'color': {
        const pile = $('#pile');
        if (pile) { pile.classList.remove('burst'); void pile.offsetWidth; pile.classList.add('burst'); }
        if (a !== me) this.announce(`${COLOR_NAME[b]}`, `${name(a)} picked`, 'col c-' + b);
        break;
      }
    }
  },
  /* Each drawn card leaves the deck at full size, curves across the table and settles into its slot in the fan. */
  oppDraw(seat, count, T) {
    const n = Math.min(count, OPP_DRAW_MAX), skin = seatCos(T, seat).card, gap = oppDrawGap(count);
    const fan = $$(`#opp-${seat} .ofan .card`), deck = $('#deck').getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const idx = Math.max(0, fan.length - n + i), slot = fan[idx];
      const tilt = slot && /rotate\((-?[\d.]+)deg/.exec(slot.style.transform);
      this.fly(backHTML(skin), deck, slot ? slot.getBoundingClientRect() : this.seatRect(seat, -1), {
        w0: deck.width, w1: slot ? slot.offsetWidth : 40, r0: -4, r1: tilt ? +tilt[1] : 0, arc: 30,
        dur: 820, delay: i * gap, ease: 'cubic-bezier(.3,.05,.2,1)',
        done: () => {
          const c = $$(`#opp-${seat} .ofan .card`)[idx];
          if (c) c.style.visibility = '';
          this.held[seat] = Math.max(0, (this.held[seat] || 0) - 1);
          Sound.play('draw');
        }
      });
    }
  },
  /* Mystery: everyone watches the same wheel land on the outcome the host already drew. */
  wheel(seat, o, T, G, me) {
    const w = MYSTERY_SLICES[o];
    if (!w) return;
    const nx = (((seat + G.dir) % G.n) + G.n) % G.n;
    const who = i => (i === me ? 'You' : esc(seatName(T, i)));
    const verb = (i, v) => (i === me ? v : v + 's');
    const res = w.id === 'skip' ? `${who(nx)} ${nx === me ? 'are' : 'is'} skipped`
      : w.self ? `${who(seat)} ${verb(seat, 'draw')} ${w.n}`
      : w.id === 'peek' ? `${who(seat)} ${verb(seat, 'see')} 3 of ${nx === me ? 'your' : esc(seatName(T, nx)) + '’s'} cards`
      : `${who(nx)} ${verb(nx, 'draw')} ${w.n} and ${nx === me ? 'are' : 'is'} skipped`;
    const el = document.createElement('div');
    el.className = 'wheelfx';
    el.innerHTML = `<div class="wh"><div class="wh-rot">${wheelSVG(MYSTERY_SLICES)}</div><i class="wh-ptr"></i><b class="wh-hub">?</b></div><div class="wh-res"><b>${esc(w.label)}</b><small>${res}</small></div>`;
    $('#fly').appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    Sound.play('mystery');
    spinWheelTo(el.querySelector('.wh-rot'), MYSTERY_SLICES.length, o, { dur: 2900, turns: 4 }).then(() => {
      el.classList.add('done');
      Sound.play(w.self ? 'hit' : 'special');
      setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 1300);
    });
  },
  /* Reveal 3: only the player who spun sees the cards. */
  reveal(target, ids, T, G) {
    const el = document.createElement('div');
    el.className = 'peek';
    el.innerHTML = `<small>${esc(seatName(T, target))}’s cards</small><div class="pk">${ids.map(id => cardHTML(G.deck[id], seatCos(T, target).card)).join('')}</div>`;
    $('#fly').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 3600);
  }
};
function cardLabel(card) {
  const col = COLOR_NAME[card.c];
  const k = isNum(card.k) ? card.k : KIND_NAME[card.k];
  return card.c === 'w' ? k : `${col} ${k}`;
}

/* ==========================================================================
   Wiring: taps, table lifecycle, boot.
   ========================================================================== */
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const makeCode = () => Array.from(crypto.getRandomValues(new Uint8Array(4)), b => CODE_CHARS[b % CODE_CHARS.length]).join('');

function sendAct(a) {
  if (app.host) {
    const seat = app.mode === 'local' ? app.viewSeat : app.host.seatOf(Prof.cid);
    return app.host.act(seat, a);
  }
  if (app.client) { app.client.send(a); return true; }
  return false;
}
function sendEmote(id) {
  if (app.host) {
    if (app.mode === 'local') { const s = app.host.seats[app.viewSeat]; if (s) { s.em = [Date.now(), id]; app.host.publish(); } }
    else app.host.myEmote(id);
  } else if (app.client) app.client.emote(id);
}

/* Every table update lands here, from a local host or a remote one. */
function onTable(T, isHost, hostHere) {
  if (!isHost) {
    if (hostHere) { app.hostGone = 0; if (app.joinWait) { clearTimeout(app.joinWait); app.joinWait = null; } }
    else if (app.T && !app.hostGone) app.hostGone = Date.now();
  }
  if (!T) { if (app.screen === 'table') render(); return; }
  const firstSight = !app.T;
  app.T = T;
  const me = mySeat(T);
  if (T.ph === 'game' && T.g && T.w && T.w.amt > 0 && app.mode !== 'local' && me >= 0) {
    if (!Prof.escrow(T.g.id, T.w.cur, T.w.amt) && !Prof.P.settled.includes(T.g.id) && !(Prof.P.escrow && Prof.P.escrow.gid === T.g.id)) {
      if (!app.warnedStake) { app.warnedStake = true; toast('Not enough coins for the stake. You play this one without a bet.'); }
    }
  }
  if (isHost && app.mode === 'online') updateLobbyPresence();
  if (T.ph === 'lobby') {
    if (app.screen === 'game') go('table');
    else if (app.screen === 'table') render();
    else if (firstSight && app.mode === 'online') go('table');
  } else {
    if (app.screen !== 'game') go('game');
    else GameUI.update();
  }
}

function leaveTable(opts) {
  const T = app.T;
  const live = T && T.ph === 'game' && T.g && T.g.w < 0;
  if (live && app.mode !== 'local' && !(opts && opts.cancelled)) Prof.forfeit(T.g.id);
  if (app.host) { app.host.close(); app.host = null; }
  if (app.client) { app.client.leave(live ? T.g.id : 1); app.client = null; }
  if (app.joinWait) { clearTimeout(app.joinWait); app.joinWait = null; }
  LS.del('mm_table');
  app.T = null; app.mode = null; app.code = null; app.isHost = false; app.hostGone = 0; app.warnedStake = false;
  app.lastGid = null; app.viewSeat = 0; GameUI.curtain = false;
  updateLobbyPresence();
}

async function createTable(snap) {
  await Net.init();
  if (!Net.kind) { toast(esc(Net.err), 'bad'); return; }
  const btn = $('[data-a="create"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Opening…'; }
  for (let i = 0; i < 4; i++) {
    const code = snap && i === 0 ? snap.code : makeCode();
    try {
      const ch = await Net.table(code, true);
      leaveTable();
      const saved = LS.get('mm_tablerules') || {};
      const h = new TableHost({ mode: 'online', code, ch, cid: Prof.cid, rules: saved.rules, wager: saved.wager, onChange: T => onTable(T, true) });
      h.hostProf = Prof.pub();
      h.addHuman(Prof.cid, Prof.pub());
      Object.assign(app, { host: h, mode: 'online', code, isHost: true });
      LS.set('mm_table', { code, role: 'host', at: Date.now(), cid: Prof.cid });
      if (snap) h.restore(snap); else h.publish();
      if (app.screen !== 'table' && app.screen !== 'game') go(app.T && app.T.ph !== 'lobby' ? 'game' : 'table');
      return;
    } catch (e) {
      if (e && e.message === 'code-taken') continue;
      toast(esc((e && e.message) || 'Could not open a table.'), 'bad');
      break;
    }
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Create table'; }
}

async function joinTable(raw) {
  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 4) { toast('Table codes are 4 letters or numbers.', 'bad'); return; }
  await Net.init();
  if (!Net.kind) { toast(esc(Net.err), 'bad'); return; }
  leaveTable();
  Object.assign(app, { mode: 'online', code, isHost: false });
  go('table');
  try {
    const ch = await Net.table(code, false);
    if (app.code !== code) { ch.leave(); return; }
    app.client = new TableClient({ ch, code, cid: Prof.cid, prof: Prof.pub(), onChange: (T, hostHere) => onTable(T, false, hostHere) });
    LS.set('mm_table', { code, role: 'guest', at: Date.now(), cid: Prof.cid });
    app.joinWait = setTimeout(() => {
      if (app.code === code && !app.T) { toast(`No table found with code ${code}.`, 'bad'); leaveTable(); go('online'); }
    }, 12000);
  } catch (e) {
    toast(esc((e && e.message) || 'Could not join.'), 'bad');
    leaveTable(); go('online');
  }
}

function startSolo() {
  const c = app.solo;
  if (c.wager.amt > Prof.bal(c.wager.cur)) { toast(`You need ${c.wager.amt} ${curName(c.wager.cur)} for that bet.`, 'bad'); return; }
  LS.set('mm_solo', c);
  leaveTable();
  const h = new TableHost({ mode: 'bots', cid: Prof.cid, rules: c.rules, wager: c.wager, onChange: T => onTable(T, true) });
  h.addHuman(Prof.cid, Prof.pub());
  for (let i = 0; i < c.bots; i++) h.addBot(c.diff);
  Object.assign(app, { host: h, mode: 'bots', isHost: true });
  h.start();
}
function startLocal() {
  const c = app.local;
  c.players.forEach((p, i) => { if (i) { const el = $('#lp' + i); if (el) p.name = el.value.trim() || 'Player ' + (i + 1); } });
  LS.set('mm_local', c);
  leaveTable();
  const h = new TableHost({ mode: 'local', cid: Prof.cid, rules: c.rules, onChange: T => onTable(T, true) });
  c.players.forEach((p, i) => h.addHuman(i ? 'local-' + i : Prof.cid, i ? { n: p.name, a: p.av, o: cosStr(DEFAULT_EQ) } : Prof.pub()));
  Object.assign(app, { host: h, mode: 'local', isHost: true, viewSeat: -1, curtainFor: -1 });
  GameUI.curtain = false;
  h.start();
}
function resumeHost() {
  const snap = LS.get('mm_host');
  if (!snap) return;
  Prof.useCid(snap.cid);
  if (snap.mode === 'online') { createTable(snap); return; }
  leaveTable();
  const h = new TableHost({ mode: snap.mode, cid: Prof.cid, onChange: T => onTable(T, true) });
  Object.assign(app, { host: h, mode: snap.mode, isHost: true });
  h.restore(snap);
}

/* Lobby presence on the artifact's shared room: who is here, open tables. */
async function initLobby() {
  await Net.init();
  try { app.lobbyCh = await Net.lobby(); } catch (e) { app.lobbyCh = null; }
  if (!app.lobbyCh) return;
  app.lobbyCh.onPeers(list => {
    app.lobbyPeers = list.filter(x => !x.me && x.p && x.p.v === 1 && x.p.lob);
    if (app.screen === 'home' || app.screen === 'online') { const el = $('#here'); if (el) el.innerHTML = hereHTML(); if (app.screen === 'online') render(); }
  });
  updateLobbyPresence();
}
let lobbyKey = '';
function updateLobbyPresence() {
  if (!app.lobbyCh || !Prof.P) return;
  const h = app.host && app.mode === 'online' ? app.host : null;
  const o = { v: 1, lob: 1, n: Prof.P.name, a: Prof.P.avatar, t: h ? h.code : null, tn: h ? Prof.P.name : null, tp: h ? h.seats.length : 0, tm: 4, ts: h ? h.phase : null };
  const k = JSON.stringify(o);
  if (k === lobbyKey) return;
  lobbyKey = k;
  app.lobbyCh.set(o);
}
function profileChanged() {
  const pub = Prof.pub();
  if (app.client) app.client.setProf(pub);
  if (app.host && app.mode === 'online') {
    app.host.hostProf = pub;
    const i = app.host.seatOf(Prof.cid);
    if (i >= 0 && app.host.phase !== 'game') { const s = app.host.seats[i]; s.name = pub.n; s.av = pub.a; s.cos = cosParse(pub.o); app.host.publish(); }
  }
  updateLobbyPresence();
}

    if (app.wheelBusy || app.screen !== 'wheel') return;
    if (P.silver < LUCKY_COST) { toast(`You need ${LUCKY_COST} silver to spin.`, 'bad'); return; }
    const k = pickLucky(), prize = LUCKY[k];
    app.coinView = { s: P.silver - LUCKY_COST, g: P.gold };
    P.silver += (prize.c === 's' ? prize.n : 0) - LUCKY_COST;
    if (prize.c === 'g') P.gold += prize.n;
    P.stats.spins = (P.stats.spins || 0) + 1;
    app.wheelBusy = true;
    Prof.save();
    const btn = $('#spinbtn'), res = $('#luckyres'), rot = $('#luckyrot');
    if (btn) { btn.disabled = true; btn.textContent = 'Spinning…'; }
    if (res) { res.className = 'lucky-res'; res.textContent = 'Good luck…'; }
    if (rot) { rot._rot = app.luckyRot || 0; await spinWheelTo(rot, LUCKY.length, k, { dur: 4600, turns: 6 }); app.luckyRot = rot._rot % 360; }
    app.wheelBusy = false; app.coinView = null; app.wheelLast = prize;
    $$('.coins').forEach(el => { el.outerHTML = coinsBar(); });
    if (app.screen === 'wheel') render();
    const big = LUCKY_SLICES[k].big;
    if (prize.n) { Sound.play(big ? 'win' : 'coin'); if (big || (prize.c === 's' ? prize.n >= 250 : prize.n >= 10)) FX.play(big ? 'fireworks' : 'coins', big ? 3200 : 1800); }
    else Sound.play('lose');
  },
  shoptab: el => go('shop', { tab: el.dataset.v }),
  tab(el) { app.tab = el.dataset.v; render(); },
  subtab(el) { app.sub = el.dataset.v; render(); },
  item: el => openItem(el.dataset.v),
  buy(el) {
    const key = el.dataset.v, it = ITEM[key];
    if (!Prof.buy(key)) { Sound.play('error'); toast('Not enough coins yet. Win a few matches!', 'bad'); return; }
    Sound.play('coin');
    if (it.cat !== 'emote') Prof.equip(it.cat, it.id);
    profileChanged();
    toast(`Unlocked ${esc(it.name || it.t)}${it.cat !== 'emote' ? ' and equipped it' : ''}!`, 'good');
    render();
    openItem(key);
  },
  equip(el) {
    const it = ITEM[el.dataset.v];
    Prof.equip(it.cat, it.id);
    profileChanged();
    Sound.play('tap');
    render();
    openItem(it.key);
  },
  previewfx: el => { closeSheet(); FX.play(el.dataset.v, 3600); },
  seg(el) {
    const [scope, k] = el.dataset.k.split('.');
    let v = el.dataset.v;
    if (/^-?\d+$/.test(v)) v = +v;
    Sound.play('tap');
    if (scope === 'set') { Prof.P.settings[k] = v; Prof.save(); if (k === 'sound' && v) Sound.unlock(); render(); return; }
    if (scope === 'solo') { app.solo[k] = v; return render(); }
    if (scope === 'sr') { app.solo.rules[k] = k === 'stack' ? !!v : v; return render(); }
    if (scope === 'sw') {
      if (k === 'cur') app.solo.wager = { cur: v, amt: 0 }; else app.solo.wager.amt = v;
      return render();
    }
    if (scope === 'lr') { app.local.rules[k] = k === 'stack' ? !!v : v; return render(); }
    if (scope === 'local') {
      const ps = app.local.players;
      const avs = FREE_CATS.filter(c => c !== Prof.P.avatar);
      while (ps.length < v) ps.push({ name: 'Player ' + (ps.length + 1), av: avs[ps.length % avs.length] });
      ps.length = v;
      return render();
    }
    if (scope === 'tb') { app.botDiff = v; return render(); }
    if (scope === 'tr' && app.host) { app.host.setRules({ [k]: k === 'stack' ? !!v : v }); LS.set('mm_tablerules', { rules: app.host.rules, wager: app.host.wager }); return; }
    if (scope === 'tw' && app.host) {
      app.host.setWager(k === 'cur' ? { cur: v, amt: 0 } : { amt: v });
      LS.set('mm_tablerules', { rules: app.host.rules, wager: app.host.wager });
    }
  },
  lpcat(el) {
    const i = +el.dataset.v;
    app.local.players.forEach((p, j) => { if (j) { const inp = $('#lp' + j); if (inp) p.name = inp.value; } });
    sheet(`<h3>Pick a cat for P${i + 1}</h3><div class="catgrid sm">${FREE_CATS.map(id => `<button class="catpick" data-a="lpsetcat" data-v="${i}:${id}">${avatar(id)}<b>${esc(CAT_BY_ID[id].name)}</b></button>`).join('')}</div>`);
  },
  lpsetcat(el) { const [i, id] = el.dataset.v.split(':'); app.local.players[+i].av = id; closeSheet(); render(); },
  startsolo: () => startSolo(),
  startlocal: () => startLocal(),
  create: () => createTable(),
  join: () => joinTable($('#jcode').value),
  jointbl: el => joinTable(el.dataset.v),
  resume() { resumeHost(); },
  rejoin() { const g = LS.get('mm_table'); if (g) { Prof.useCid(g.cid); joinTable(g.code); } },
  dropresume() {
    const snap = LS.get('mm_host');
    if (snap && snap.S && Prof.P.escrow && Prof.P.escrow.gid === snap.S.gid) Prof.forfeit(snap.S.gid);
    LS.del('mm_host'); LS.del('mm_table');
    render();
  },
  addbot() { if (app.host) app.host.addBot(app.botDiff || 'normal'); },
  rmseat: el => app.host && app.host.removeSeat(+el.dataset.v),
  async copycode() { const ok = await copyText(app.code); toast(ok ? `Copied ${app.code}` : `Code: <b>${app.code}</b>`); },
  ready() {
    if (!app.client || !app.T) return;
    const me = app.T.s.find(s => s.c === Prof.cid);
    app.client.ready(me && me.r ? null : app.T.tok);
    Sound.play('tap');
  },
  hoststart() {
    const h = app.host;
    if (!h || !h.allReady()) return;
    if (h.wager.amt > Prof.bal(h.wager.cur)) { toast(`You need ${h.wager.amt} ${curName(h.wager.cur)} to host this bet.`, 'bad'); return; }
    h.start();
  },
  leave() {
    const T = app.T;
    const live = T && T.ph === 'game' && T.g && T.g.w < 0;
    if (live) {
      sheet(`<h3>Leave this match?</h3><p>${T.w && T.w.amt && app.mode !== 'local' ? `Your stake of ${coin(T.w.cur)}<b>${T.w.amt}</b> stays in the pot.` : 'The match goes on without you.'}${app.isHost && app.mode === 'online' ? ' You are the host, so the table closes for everyone and their stakes are refunded.' : ''}</p>
        <div class="row2"><button class="btn ghost" data-a="closesheet">Stay</button><button class="btn warn" data-a="leaveok">Leave</button></div>`);
      return;
    }
    ACT.leaveok();
  },
  leaveok() { closeSheet(); const wasOnline = app.mode === 'online'; leaveTable(); FX.stop(); go(wasOnline ? 'online' : 'home'); },
  rematch() { FX.stop(); if (app.host) app.host.rematch(); },
  card(el) { GameUI.onCard(+el.dataset.id); },
  /* The draw pile does all three: draw a card, take a +stack, or pass after drawing. */
  deck() {
    const T = app.T, G = T && T.g && decGame(T.g);
    if (!G || G.winner >= 0 || G.phase !== 'play' || G.turn !== mySeat(T) || GameUI.curtain) return;
    sendAct(G.pending ? ['a'] : G.drew >= 0 ? ['k'] : ['d']);
  },
  draw: () => sendAct(['d']),
  keep: () => sendAct(['k']),
  accept: () => sendAct(['a']),
  reveal() { app.viewSeat = app.curtainFor; GameUI.curtain = false; GameUI.keys = {}; GameUI.update(); },
  color: el => sendAct(['c', el.dataset.v]),
  target: el => sendAct(['t', +el.dataset.v]),
  emotes() {
    const list = Prof.emotes();
    sheet(`<h3>Send an emote</h3><div class="emogrid">${list.map(e => `<button class="emobtn" data-a="emote" data-v="${e.id}"><span>${e.e}</span><b>${esc(e.t)}</b></button>`).join('')}</div><p class="hint">More emotes in the shop.</p>`);
  },
  emote(el) { closeSheet(); sendEmote(el.dataset.v); },
  gmenu() {
    const on = Prof.P.settings.sound;
    sheet(`<h3>Menu</h3><div class="menulist">
      <button class="btn ghost" data-a="togglesound">${on ? UI_ICON.sound + ' Sound on' : UI_ICON.mute + ' Sound off'}</button>
      <button class="btn ghost" data-a="quickrules">Special cards cheat sheet</button>
      <button class="btn warn" data-a="leave">Leave match</button></div>`);
  },
  togglesound() { Prof.P.settings.sound = Prof.P.settings.sound ? 0 : 1; Prof.save(); Sound.unlock(); ACT.gmenu(); },
  quickrules() {
    const sk = Prof.P.eq.card;
    sheet(`<h3>Special cards</h3><div class="qrules">${UNIQUE_CARDS.concat(CLASSIC_CARDS.filter(c => 'DF'.includes(c.k))).map(c => `<div class="rcard">${cardHTML({ c: c.c, k: c.k }, sk)}<div><b>${esc(c.name)}</b><p>${esc(c.text)}</p></div></div>`).join('')}</div>`);
  }
};

GameUI.onCard = function (id) {
  const T = app.T;
  if (!T || !T.g) return;
  const G = decGame(T.g), me = mySeat(T);
  const el = $(`#hand .hc[data-id="${id}"]`);
  const nope = () => { if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } Sound.play('error'); };
  if (G.turn !== me || G.winner >= 0) { nope(); return; }
  const quick = Prof.P.settings.quick;
  if (G.phase === 'give') {
    if (app.sel === id || quick) { app.sel = null; sendAct(['g', id]); } else { app.sel = id; Sound.play('tap'); }
    this.keys.hand = ''; this.update();
    return;
  }
  if (!canPlay(mirrorState(G), me, id)) {
    nope();
    if (G.pending) toast(G.rules.stack ? 'Only a +2, a +4 or a Shield works right now.' : 'Only a Shield can answer a draw card here.');
    else if (G.drew >= 0) toast('You can only play the card you just drew.');
    return;
  }
  if (app.sel === id || quick) { app.sel = null; sendAct(['p', id]); }
  else { app.sel = id; Sound.play('tap'); }
  this.keys.hand = '';
  this.update();
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  Sound.unlock();
  const fn = ACT[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'jcode') ACT.join();
  if (e.key === 'Enter' && e.target && e.target.id === 'nm') ACT.setupdone();
  if (e.key === 'Escape' && !$('#modal').hidden) closeSheet();
});
addEventListener('resize', () => { if (app.screen === 'game') { GameUI.keys.hand = ''; GameUI.update(); } });
setInterval(() => {
  if (app.client && app.hostGone && Date.now() - app.hostGone > 45000) {
    const e = Prof.refund();
    toast(`The host left, so the match was cancelled.${e ? ` Your ${e.amt} ${curName(e.cur)} stake came back.` : ''}`);
    leaveTable({ cancelled: true });
    go('online');
  } else if (app.client && app.hostGone && app.screen === 'game') GameUI.renderTop(app.T, decGame(app.T.g));
}, 3000);

/* ---------- boot ---------- */
async function boot() {
  Prof.init();
  Cloud.init();
  FX.setup();
  Prof.listeners.push(() => Cloud.queue());
  Prof.listeners.push(() => { $$('.coins').forEach(el => { el.outerHTML = coinsBar(); }); });
  const dbP = Prof.connectDb();
  if (!Prof.P) {
    app.screen = 'splash'; render();
    await Promise.race([dbP, sleep(2500)]);
  }
  let snap = LS.get('mm_host');
  /* A match saved by an older version can't continue under the new rules: refund it and drop it. */
  if (snap && snap.v !== PROTO) {
    if (Prof.P && Prof.P.escrow && snap.S && Prof.P.escrow.gid === snap.S.gid) {
      const e = Prof.refund();
      if (e) setTimeout(() => toast(`Refunded your ${e.amt} ${curName(e.cur)} stake from a match saved before the update.`), 800);
    }
    LS.del('mm_host'); snap = null;
  }
  if (Prof.P && Prof.P.escrow && Date.now() - Prof.P.escrow.at > 25 * 60 * 1000 && !(snap && snap.S && snap.S.gid === Prof.P.escrow.gid)) {
    const e = Prof.refund();
    if (e) setTimeout(() => toast(`Refunded your ${e.amt} ${curName(e.cur)} stake from an unfinished match.`), 800);
  }
  go(Prof.P ? 'home' : 'setup');
  Cloud.sync().then(changed => { if (changed && Prof.P && (app.screen === 'home' || app.screen === 'profile' || app.screen === 'shop' || app.screen === 'setup')) go(app.screen === 'setup' ? 'home' : app.screen); });
  dbP.then(changed => { if (changed && (app.screen === 'home' || app.screen === 'profile' || app.screen === 'shop')) render(); });
  initLobby();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && app.screen === 'game') GameUI.wake(true); });
let booted = false;
const bootOnce = () => { if (!booted) { booted = true; boot(); } };
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') {
  try { window.claude.hot.ready(bootOnce); } catch (e) { bootOnce(); }
  setTimeout(bootOnce, 1500);
} else bootOnce();

</script>
